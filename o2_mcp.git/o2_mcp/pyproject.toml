[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "o2-mcp"
version = "1.0.0"
description = "OpenObserve MCP Server — tools for SQL, VRL, schema, and log analytics"
requires-python = ">=3.11"

dependencies = [
    "fastmcp>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.2",
    "requests>=2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pydantic-settings>=2.3.0",
    "sqlglot>=25.0.0",
    "structlog>=24.0.0",
    "mcp>=0.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.0.0",
    "coverage>=7.0.0",
]

[project.scripts]
o2-mcp = "src.server:main"
o2-mcp-server = "app:main"

[[tool.uv.index]]
name = "walmart-pypi"
url = "https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/pythonhosted-pypi-release-remote/simple/"
default = true

[[tool.uv.index]]
name = "walmart-maof-agent-kit"
url = "https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/intl-ecomm-svcs-pypi/simple"

[[tool.uv.index]]
name = "walmart-devtools-pypi"
url = "https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/devtools-pypi/simple/"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=term-missing"

